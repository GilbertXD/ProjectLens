app:
  name: ProjectLens
  env: development
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s

log:
  level: info
  format: text

cors:
  allowed_origins: []
  allowed_methods: [GET, OPTIONS]
  allowed_headers: [Content-Type, X-Request-ID]
