x-app-build: &app-build
  context: .
  args:
    GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *runtime-defaults
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    build: *app-build
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    volumes:
      - scanner_cache:/var/cache/projectlens
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &api-environment
      APP_NAME: "${APP_NAME:-ProjectLens}"
      APP_ENV: "${APP_ENV:-production}"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_BEARER_TOKENS: "${AUTH_BEARER_TOKENS:-projectlens-dev-token}"
      SERVER_READ_HEADER_TIMEOUT: "${SERVER_READ_HEADER_TIMEOUT:-5s}"
      SERVER_REQUEST_TIMEOUT: "${SERVER_REQUEST_TIMEOUT:-8s}"
      SERVER_MAX_HEADER_BYTES: "${SERVER_MAX_HEADER_BYTES:-65536}"
      SERVER_MAX_BODY_BYTES: "${SERVER_MAX_BODY_BYTES:-4194304}"
      SERVER_MAX_IN_FLIGHT: "${SERVER_MAX_IN_FLIGHT:-128}"
      SERVER_READ_TIMEOUT: "${SERVER_READ_TIMEOUT:-5s}"
      SERVER_WRITE_TIMEOUT: "${SERVER_WRITE_TIMEOUT:-10s}"
      SERVER_IDLE_TIMEOUT: "${SERVER_IDLE_TIMEOUT:-60s}"
      SERVER_SHUTDOWN_TIMEOUT: "${SERVER_SHUTDOWN_TIMEOUT:-10s}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      REDIS_ENABLED: "${REDIS_ENABLED:-true}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-projectlens}"
      REDIS_DIAL_TIMEOUT: "${REDIS_DIAL_TIMEOUT:-300ms}"
      REDIS_READ_TIMEOUT: "${REDIS_READ_TIMEOUT:-300ms}"
      REDIS_WRITE_TIMEOUT: "${REDIS_WRITE_TIMEOUT:-300ms}"
      SEARCH_DEFAULT_LIMIT: "${SEARCH_DEFAULT_LIMIT:-20}"
      SEARCH_MAX_LIMIT: "${SEARCH_MAX_LIMIT:-100}"
      SEARCH_MAX_QUERY_LENGTH: "${SEARCH_MAX_QUERY_LENGTH:-200}"
      SEARCH_CACHE_TTL: "${SEARCH_CACHE_TTL:-5m}"
      DATABASE_URL: "${DATABASE_URL:-postgres://projectlens:projectlens@postgres:5432/projectlens?sslmode=disable}"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-10}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-2}"
      DB_MAX_CONN_LIFETIME: "${DB_MAX_CONN_LIFETIME:-30m}"
      DB_MAX_CONN_IDLE_TIME: "${DB_MAX_CONN_IDLE_TIME:-5m}"
      DB_HEALTH_CHECK_PERIOD: "${DB_HEALTH_CHECK_PERIOD:-1m}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5s}"
      REPO_ALLOWED_LOCAL_ROOTS: "${REPO_ALLOWED_LOCAL_ROOTS:-}"
      GITHUB_GIT_BASE_URL: "${GITHUB_GIT_BASE_URL:-}"
      GITHUB_API_BASE_URL: "${GITHUB_API_BASE_URL:-https://api.github.com}"
      SCANNER_CACHE_DIR: "/var/cache/projectlens"
      SCANNER_GIT_TIMEOUT: "${SCANNER_GIT_TIMEOUT:-2m}"
      SCANNER_MAX_FILE_SIZE: "${SCANNER_MAX_FILE_SIZE:-1048576}"
      SCANNER_MAX_TOTAL_BYTES: "${SCANNER_MAX_TOTAL_BYTES:-52428800}"
      SCANNER_MAX_FILES: "${SCANNER_MAX_FILES:-10000}"
      SCANNER_MAX_PATH_LENGTH: "${SCANNER_MAX_PATH_LENGTH:-512}"
      SCANNER_MAX_PATH_DEPTH: "${SCANNER_MAX_PATH_DEPTH:-32}"
      SCANNER_EXCLUDE_PATTERNS: "${SCANNER_EXCLUDE_PATTERNS:-}"
      DOCUMENT_MAX_CONTENT_BYTES: "${DOCUMENT_MAX_CONTENT_BYTES:-1048576}"
      SYNC_RETAIN_SUPERSEDED: "${SYNC_RETAIN_SUPERSEDED:-2}"
      SYNC_FAILED_RETENTION: "${SYNC_FAILED_RETENTION:-24h}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_TIMEOUT: "${GITHUB_TIMEOUT:-10s}"
      GITHUB_USER_AGENT: "${GITHUB_USER_AGENT:-ProjectLens}"
      DB_AUTO_MIGRATE: "${DB_AUTO_MIGRATE:-true}"
      SCHEDULE_MIN_INTERVAL_SECONDS: "${SCHEDULE_MIN_INTERVAL_SECONDS:-60}"
      SCHEDULE_BATCH: "${SCHEDULE_BATCH:-4}"
      WORKER_ENABLE_MOCK_JOBS: "${WORKER_ENABLE_MOCK_JOBS:-false}"
      METRICS_ADDR: "${METRICS_ADDR:-}"
      TRACE_ENABLED: "${TRACE_ENABLED:-false}"
      WORKER_MODE: "${WORKER_MODE:-embedded}"
      WORKER_ID: "${WORKER_ID:-}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      WORKER_POLL_INTERVAL: "${WORKER_POLL_INTERVAL:-500ms}"
      WORKER_LEASE_DURATION: "${WORKER_LEASE_DURATION:-30s}"
      WORKER_HEARTBEAT_INTERVAL: "${WORKER_HEARTBEAT_INTERVAL:-10s}"
      WORKER_DEFAULT_TIMEOUT: "${WORKER_DEFAULT_TIMEOUT:-5m}"
      WORKER_DEFAULT_MAX_ATTEMPTS: "${WORKER_DEFAULT_MAX_ATTEMPTS:-3}"
      WORKER_RETRY_BASE_DELAY: "${WORKER_RETRY_BASE_DELAY:-2s}"
      WORKER_RETRY_MAX_DELAY: "${WORKER_RETRY_MAX_DELAY:-1m}"
      WORKER_SHUTDOWN_TIMEOUT: "${WORKER_SHUTDOWN_TIMEOUT:-15s}"
    stop_grace_period: "${API_STOP_GRACE_PERIOD:-30s}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  worker:
    <<: *runtime-defaults
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    volumes:
      - scanner_cache:/var/cache/projectlens
    profiles: ["worker"]
    build: *app-build
    entrypoint: ["/app/worker"]
    command: ["-config", "/app/configs/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-environment
    stop_grace_period: "${WORKER_STOP_GRACE_PERIOD:-20s}"
    healthcheck:
      disable: true

  migrate:
    <<: *runtime-defaults
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    restart: "no"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    profiles: ["migrate"]
    build: *app-build
    entrypoint: ["/app/migrate"]
    command: ["-config", "/app/configs/config.yaml", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-environment
      DB_AUTO_MIGRATE: "false"
    healthcheck:
      disable: true

  postgres:
    <<: *runtime-defaults
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-projectlens}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-projectlens}"
      POSTGRES_DB: "${POSTGRES_DB:-projectlens}"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    <<: *runtime-defaults
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    image: redis:7-alpine
    user: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi
          redis-cli ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  scanner_cache:
