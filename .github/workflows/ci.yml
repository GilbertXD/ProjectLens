name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://projectlens:projectlens@127.0.0.1:5432/projectlens?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: projectlens
          POSTGRES_PASSWORD: projectlens
          POSTGRES_DB: projectlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectlens -d projectlens"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -run '^TestOpenAPIRouteParity$' ./internal/router
      - run: go test -race -count=1 -v ./...
      - run: go build ./...
      - run: docker compose config -q
