app:
  name: ProjectLens
  env: development
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s

log:
  level: info
  format: text

cors:
  allowed_origins: []
  allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowed_headers: [Content-Type, X-Request-ID]

database:
  dsn: postgres://projectlens:projectlens@localhost:5432/projectlens?sslmode=disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_period: 1m
  connect_timeout: 5s
  auto_migrate: true

repository:
  allowed_local_roots: []

github:
  api_base_url: https://api.github.com
  token: ""
  timeout: 10s
  user_agent: ProjectLens

worker:
  mode: embedded
  id: ""
  concurrency: 4
  poll_interval: 500ms
  lease_duration: 30s
  heartbeat_interval: 10s
  default_timeout: 5m
  default_max_attempts: 3
  retry_base_delay: 2s
  retry_max_delay: 1m
  shutdown_timeout: 15s

scanner:
  cache_dir: ""
  git_timeout: 2m
  max_file_size: 1048576
  max_total_bytes: 52428800
  max_files: 10000
  max_path_length: 512
  max_path_depth: 32
  exclude_patterns: []
