components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
  parameters:
    id:
      name: "id"
      in: "path"
      required: true
      schema: {"type": "string", "format": "uuid"}
    repoId:
      name: "repoId"
      in: "path"
      required: true
      schema: {"type": "string", "format": "uuid"}
    docId:
      name: "docId"
      in: "path"
      required: true
      schema: {"type": "string", "format": "uuid"}
    Limit:
      name: "limit"
      in: "query"
      schema: {"type": "integer", "minimum": 1}
    Offset:
      name: "offset"
      in: "query"
      schema: {"type": "integer", "minimum": 0}
    HistorySHA:
      name: sha
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
    HistoryPath:
      name: path
      in: query
      required: true
      description: "Literal repository-relative file path. URL-encode reserved characters."
      schema: {type: string, minLength: 1}
    HistoryRef:
      name: ref
      in: query
      description: "Branch, tag, or full commit SHA."
      schema: {type: string, default: HEAD}
    HistoryLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    HistoryOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
    DocumentScope:
      name: "scope"
      in: "query"
      schema: {"$ref": "#/components/schemas/KnowledgeScope"}
    RepositoryIDFilter:
      name: "repository_id"
      in: "query"
      schema: {"type": "string", "format": "uuid"}
    IfMatch:
      name: "If-Match"
      in: "header"
      description: "Document version. Accepts a quoted number, a weak ETag or an unquoted number. For PUT and PATCH use this or the body version. If both are supplied they must match. Optional on DELETE."
      schema: {"type": "string", "example": "\"1\""}
  responses:
    BadRequest:
      description: "Invalid request"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "invalid request"
            code: "invalid_input"
    Unauthorized:
      description: "Missing or invalid bearer token"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
        WWW-Authenticate:
          description: "Bearer challenge."
          schema: {"type": "string", "example": "Bearer realm=\"ProjectLens\""}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "missing or invalid bearer token"
            code: "unauthorized"
    Forbidden:
      description: "Repository access forbidden"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "repository access forbidden"
            code: "forbidden"
    NotFound:
      description: "Resource not found"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "resource not found"
            code: "not_found"
    Conflict:
      description: "Resource or document version conflict"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "resource or document version conflict"
            code: "conflict"
    PayloadTooLarge:
      description: "HTTP payload exceeds the configured size limit"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "http payload or document exceeds the configured limit"
            code: "payload_too_large"
    RateLimited:
      description: "Upstream rate limit exceeded"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "upstream rate limit exceeded"
            code: "rate_limited"
    InternalError:
      description: "Internal server error"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "internal server error"
            code: "internal_error"
    BadGateway:
      description: "Upstream service unavailable"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "upstream service unavailable"
            code: "upstream_error"
    ServiceUnavailable:
      description: "Server in-flight capacity exhausted"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
        Retry-After:
          description: "Seconds to wait before attempting another request."
          schema: {"type": "integer", "example": 1}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "server in-flight capacity exhausted"
            code: "service_unavailable"
    RequestTimeout:
      description: "Request deadline exceeded"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "request deadline exceeded"
            code: "request_timeout"
  schemas:
    PolicyList:
      type: object
      properties:
        items: {"type": "array", "items": {"$ref": "#/components/schemas/SyncPolicy"}}
    SyncPolicy:
      type: object
      properties:
        kind: {"type": "string", "enum": ["files", "commits", "github_activity"]}
        enabled: {"type": "boolean"}
        interval_seconds: {"type": "integer"}
        next_at: {"type": "string", "format": "date-time", "nullable": true}
        last_job_id: {"type": "string", "format": "uuid", "nullable": true}
        last_success_at: {"type": "string", "format": "date-time", "nullable": true}
        last_error_code: {"type": "string", "nullable": true}
    ActivityPage:
      type: object
      properties:
        items: {"type": "array", "items": {"$ref": "#/components/schemas/GitHubActivity"}}
        offset: {"type": "integer"}
        limit: {"type": "integer"}
    GitHubActivity:
      type: object
      properties:
        repository_id: {"type": "string", "format": "uuid"}
        kind: {"type": "string"}
        number: {"type": "integer"}
        id: {"type": "integer", "format": "int64"}
        user: {"type": "object", "properties": {"login": {"type": "string"}}}
        title: {"type": "string"}
        body: {"type": "string"}
        state: {"type": "string"}
        html_url: {"type": "string"}
        sha: {"type": "string"}
        path: {"type": "string"}
        commit_id: {"type": "string"}
        line: {"type": "integer"}
        created_at: {"type": "string", "format": "date-time"}
        updated_at: {"type": "string", "format": "date-time"}
        truncated: {"type": "boolean"}
    CommitComparison:
      type: object
      properties:
        items: {"type": "array", "items": {"$ref": "#/components/schemas/FileChange"}}
        total: {"type": "integer"}
        truncated: {"type": "boolean"}
        base: {"type": "string"}
        head: {"type": "string"}
        patch: {"type": "string"}
        patch_truncated: {"type": "boolean"}
    FileChangePage:
      type: object
      properties:
        items: {"type": "array", "items": {"$ref": "#/components/schemas/FileChange"}}
        total: {"type": "integer"}
        truncated: {"type": "boolean"}
    FileChange:
      type: object
      properties:
        path: {"type": "string"}
        type: {"type": "string"}
        old_path: {"type": "string"}
        binary: {"type": "boolean"}
        insertions: {"type": "integer"}
        deletions: {"type": "integer"}
    HistoryWindow:
      type: object
      properties:
        window_limit: {type: integer, example: 2000}
        page_size: {type: integer, example: 100}
        complete: {type: boolean, description: "All reachable commits are imported."}
        truncated: {type: boolean, description: "Older commits exist beyond the imported window."}
        window_limit_reached: {type: boolean, description: "The import reached its cap and older commits exist."}
        window_status: {type: string, enum: [complete, partial, window_limit_reached]}
    CommitHistoryPage:
      allOf:
        - {$ref: "#/components/schemas/HistoryWindow"}
        - type: object
          properties:
            ref: {type: string}
            tip: {type: string}
            synced_at: {type: string, format: date-time}
            total: {type: integer}
            has_more: {type: boolean}
            items: {type: array, items: {$ref: "#/components/schemas/CommitHistoryEntry"}}
    CommitHistorySyncResult:
