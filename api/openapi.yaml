      operationId: "searchProject"
      summary: "Search active Git snapshots and Markdown documents"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"name": "q", "in": "query", "required": true, "schema": {"type": "string", "minLength": 1}}
        - {"name": "source_type", "in": "query", "schema": {"type": "array", "items": {"type": "string", "enum": ["local_git", "github", "document"]}}, "style": "form", "explode": true, "description": "Repeat this parameter or supply comma-separated source types."}
        - {"$ref": "#/components/parameters/RepositoryIDFilter"}
        - {"name": "scope", "in": "query", "schema": {"$ref": "#/components/schemas/SearchScope"}, "description": "Defaults to all content. Use project for project documents only, repository with repository_id, or cross_repository to select repositories explicitly."}
        - {"name": "repository_ids", "in": "query", "schema": {"type": "array", "items": {"type": "string", "format": "uuid"}}, "style": "form", "explode": true, "description": "Cross-repository selection. Repeat the parameter or supply comma-separated UUIDs."}
        - {"name": "repository_role", "in": "query", "schema": {"$ref": "#/components/schemas/RepositoryRole"}, "description": "Cross-repository selection by role."}
        - {"name": "include_project_documents", "in": "query", "schema": {"type": "boolean", "default": false}, "description": "Include project-level documents in cross-repository search."}
        - {"name": "path_prefix", "in": "query", "schema": {"type": "string"}}
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/Offset"}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
            X-Search-Cache:
              description: "Cache outcome."
              schema: {"type": "string", "enum": ["hit", "miss", "bypass", "degraded"]}
            X-Search-Version:
              description: "Project search version for cache invalidation."
              schema: {"type": "integer", "format": "int64"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/SearchResult"}
        "400": {"$ref": "#/components/responses/BadRequest"}
