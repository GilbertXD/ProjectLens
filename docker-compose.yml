services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "${APP_NAME:-ProjectLens}"
      APP_ENV: "${APP_ENV:-production}"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_READ_TIMEOUT: "${SERVER_READ_TIMEOUT:-5s}"
      SERVER_WRITE_TIMEOUT: "${SERVER_WRITE_TIMEOUT:-10s}"
      SERVER_IDLE_TIMEOUT: "${SERVER_IDLE_TIMEOUT:-60s}"
      SERVER_SHUTDOWN_TIMEOUT: "${SERVER_SHUTDOWN_TIMEOUT:-10s}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
