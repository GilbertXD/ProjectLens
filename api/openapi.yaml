components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
  parameters:
    id:
      name: "id"
      in: "path"
      required: true
      schema: {"type": "string", "format": "uuid"}
    repoId:
      name: "repoId"
      in: "path"
      required: true
      schema: {"type": "string", "format": "uuid"}
    docId:
      name: "docId"
      in: "path"
      required: true
      schema: {"type": "string", "format": "uuid"}
    Limit:
      name: "limit"
      in: "query"
      schema: {"type": "integer", "minimum": 1}
    Offset:
      name: "offset"
      in: "query"
      schema: {"type": "integer", "minimum": 0}
    IfMatch:
      name: "If-Match"
      in: "header"
      description: "Document version. Accepts a quoted number, a weak ETag or an unquoted number. For PUT and PATCH use this or the body version. If both are supplied they must match. Optional on DELETE."
      schema: {"type": "string", "example": "\"1\""}
  responses:
    BadRequest:
      description: "Invalid request"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "invalid request"
            code: "invalid_input"
    Unauthorized:
      description: "Missing or invalid bearer token"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
        WWW-Authenticate:
          description: "Bearer challenge."
          schema: {"type": "string", "example": "Bearer realm=\"ProjectLens\""}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "missing or invalid bearer token"
            code: "unauthorized"
    Forbidden:
      description: "Repository access forbidden"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "repository access forbidden"
            code: "forbidden"
    NotFound:
      description: "Resource not found"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "resource not found"
            code: "not_found"
    Conflict:
      description: "Resource or document version conflict"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "resource or document version conflict"
            code: "conflict"
    PayloadTooLarge:
      description: "HTTP payload exceeds the configured size limit"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "http payload or document exceeds the configured limit"
            code: "payload_too_large"
    RateLimited:
      description: "Upstream rate limit exceeded"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "upstream rate limit exceeded"
            code: "rate_limited"
    InternalError:
      description: "Internal server error"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "internal server error"
            code: "internal_error"
    BadGateway:
      description: "Upstream service unavailable"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "upstream service unavailable"
            code: "upstream_error"
    ServiceUnavailable:
      description: "Server in-flight capacity exhausted"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
        Retry-After:
          description: "Seconds to wait before attempting another request."
          schema: {"type": "integer", "example": 1}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "server in-flight capacity exhausted"
            code: "service_unavailable"
    RequestTimeout:
      description: "Request deadline exceeded"
      headers:
        X-Request-ID:
          description: "Request correlation ID."
          schema: {"type": "string"}
      content:
        "application/json":
          schema: {"$ref": "#/components/schemas/Error"}
          example:
            error: "request deadline exceeded"
            code: "request_timeout"
  schemas:
    Error:
      type: "object"
      required: ["error", "code"]
      properties:
        error: {"type": "string"}
        code: {"type": "string"}
        request_id: {"type": "string"}
    Health:
      type: "object"
      required: ["status", "service", "env", "version", "timestamp", "uptime"]
      properties:
        status: {"type": "string"}
        service: {"type": "string"}
        env: {"type": "string"}
        version: {"type": "string"}
        timestamp: {"type": "string", "format": "date-time"}
        uptime: {"type": "string"}
    Readiness:
      type: "object"
      required: ["status", "checks"]
      properties:
        status: {"type": "string", "enum": ["ok", "unavailable"]}
        checks:
          type: "object"
          required: ["postgres", "redis"]
          properties:
            postgres: {"type": "string", "enum": ["ok", "unavailable"]}
            redis: {"type": "string", "enum": ["ok", "degraded", "disabled"]}
    YAMLSpecification: {"type": "string"}
    JSONSpecification: {"type": "object", "additionalProperties": true}
    Ping:
      type: "object"
      required: ["message"]
      properties:
        message: {"type": "string", "example": "pong"}
    ProjectStatus: {"type": "string", "enum": ["active", "archived"]}
    RepositorySourceType: {"type": "string", "enum": ["local_git", "github"]}
    SnapshotStatus: {"type": "string", "enum": ["staging", "active", "superseded", "failed"]}
    JobStatus: {"type": "string", "enum": ["pending", "running", "succeeded", "failed", "cancelled"]}
    SearchHitKind: {"type": "string", "enum": ["source_file", "document"]}
    SearchSourceType: {"type": "string", "enum": ["local_git", "github", "document"]}
    SearchCacheStatus: {"type": "string", "enum": ["hit", "miss", "bypass", "degraded"]}
    Job:
      type: "object"
      required: ["id", "type", "status", "payload", "attempt", "max_attempts", "timeout_seconds", "run_at", "created_at", "updated_at"]
      properties:
        id: {"type": "string", "format": "uuid"}
        type: {"type": "string"}
        status: {"$ref": "#/components/schemas/JobStatus"}
        payload: {"type": "object", "additionalProperties": true}
        result: {}
        idempotency_key: {"type": "string"}
        attempt: {"type": "integer"}
        max_attempts: {"type": "integer"}
        timeout_seconds: {"type": "integer"}
        run_at: {"type": "string", "format": "date-time"}
