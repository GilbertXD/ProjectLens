openapi: "3.0.3"
info:
  title: "ProjectLens API"
  version: "0.1.0"
  description: "Manage projects, Git snapshots, Markdown documents, search, and asynchronous jobs. API routes require a bearer token when authentication is enabled. The service also handles unauthenticated CORS preflight requests."
paths:
  "/healthz":
    get:
      operationId: "getHealth"
      summary: "Check process liveness"
      security: []
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Health"}
  "/readyz":
    get:
      operationId: "getReadiness"
      summary: "Check service readiness"
      security: []
      description: "PostgreSQL is required. Redis failure is reported as degraded and search continues through PostgreSQL."
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Readiness"}
        "503":
          description: "PostgreSQL unavailable"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Readiness"}
  "/openapi.yaml":
    get:
      operationId: "getOpenAPIYAML"
      summary: "Fetch OpenAPI as YAML"
      security: []
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/yaml":
              schema: {"$ref": "#/components/schemas/YAMLSpecification"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
  "/openapi.json":
    get:
      operationId: "getOpenAPIJSON"
      summary: "Fetch OpenAPI as JSON"
      security: []
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/JSONSpecification"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
  "/api/v1/ping":
    get:
      operationId: "ping"
      summary: "Check authenticated API access"
      security:
        - {"BearerAuth": []}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Ping"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects":
    get:
      operationId: "listProjects"
      summary: "List projects"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/Offset"}
        - {"name": "status", "in": "query", "schema": {"type": "string", "enum": ["active", "archived"]}}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ProjectListResult"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    post:
      operationId: "createProject"
      summary: "Create a project"
      security:
        - {"BearerAuth": []}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/ProjectInput"}
      responses:
        "201":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Project"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}":
    parameters:
      - {"$ref": "#/components/parameters/id"}
    get:
      operationId: "getProject"
      summary: "Get a project"
      security:
        - {"BearerAuth": []}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Project"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    put:
      operationId: "replaceProject"
      summary: "Replace a project"
      security:
        - {"BearerAuth": []}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/ProjectReplace"}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Project"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    patch:
      operationId: "patchProject"
      summary: "Update selected project fields"
      security:
        - {"BearerAuth": []}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/ProjectPatch"}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Project"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    delete:
      operationId: "deleteProject"
      summary: "Delete a project"
      security:
        - {"BearerAuth": []}
      responses:
        "204":
          description: "No content"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/repositories":
    parameters:
      - {"$ref": "#/components/parameters/id"}
    get:
      operationId: "listRepositories"
      summary: "List project repositories"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/Offset"}
        - {"name": "source_type", "in": "query", "schema": {"type": "string", "enum": ["local_git", "github"]}}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/RepositoryListResult"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    post:
      operationId: "associateRepository"
      summary: "Associate a local or public GitHub repository"
      security:
        - {"BearerAuth": []}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/RepositoryInput"}
      responses:
        "201":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Repository"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "429": {"$ref": "#/components/responses/RateLimited"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "502": {"$ref": "#/components/responses/BadGateway"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/repositories/{repoId}":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/repoId"}
    get:
      operationId: "getRepository"
      summary: "Get a repository"
      security:
        - {"BearerAuth": []}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Repository"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    patch:
      operationId: "patchRepository"
      summary: "Update repository name or description"
      security:
        - {"BearerAuth": []}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/RepositoryPatch"}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Repository"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    delete:
      operationId: "deleteRepository"
      summary: "Delete a repository"
      security:
        - {"BearerAuth": []}
      responses:
        "204":
          description: "No content"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/repositories/{repoId}/sync":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/repoId"}
    post:
      operationId: enqueueFileSync
      summary: Publish a searchable file snapshot asynchronously
      security: [{BearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false, properties: {ref: {type: string, default: HEAD}}}
      responses:
        "202": {description: "Queued. Returns job_id, status and poll_url."}
        "200": {description: "Active job reused."}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {description: "Another ref is pending or running."}
  "/api/v1/projects/{id}/repositories/{repoId}/refresh-metadata":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/repoId"}
    post:
      operationId: "refreshRepository"
      summary: "Refresh repository metadata"
      security:
        - {"BearerAuth": []}
      description: "To publish searchable Git content, enqueue a repository.sync job with project_id, repository_id and optional ref."
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Repository"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "429": {"$ref": "#/components/responses/RateLimited"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "502": {"$ref": "#/components/responses/BadGateway"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/repositories/{repoId}/snapshots":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/repoId"}
    get:
      operationId: "listSnapshots"
      summary: "List repository snapshots"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/Offset"}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/SnapshotListResult"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/repositories/{repoId}/snapshots/active":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/repoId"}
    get:
      operationId: "getActiveSnapshot"
      summary: "Get the active repository snapshot"
      security:
        - {"BearerAuth": []}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Snapshot"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/repositories/{repoId}/files":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/repoId"}
    get:
      operationId: "searchFiles"
      summary: "List or filter files in the active snapshot"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/Offset"}
        - {"name": "q", "in": "query", "schema": {"type": "string"}}
        - {"name": "path_prefix", "in": "query", "schema": {"type": "string"}}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/SourceFileListResult"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/repositories/{repoId}/files/content":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/repoId"}
    get:
      operationId: "getFile"
      summary: "Get a file and its indexed content"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"name": "path", "in": "query", "required": true, "schema": {"type": "string"}}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/SourceFile"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/documents":
    parameters:
      - {"$ref": "#/components/parameters/id"}
    get:
      operationId: "listDocuments"
      summary: "List document summaries"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"$ref": "#/components/parameters/Limit"}
        - {"$ref": "#/components/parameters/Offset"}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/DocumentListResult"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    post:
      operationId: "createDocument"
      summary: "Create a Markdown document"
      security:
        - {"BearerAuth": []}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/DocumentInput"}
      responses:
        "201":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
            ETag:
              description: "Strong, quoted document version."
              schema: {"type": "string", "example": "\"1\""}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Document"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
  "/api/v1/projects/{id}/documents/{docId}":
    parameters:
      - {"$ref": "#/components/parameters/id"}
      - {"$ref": "#/components/parameters/docId"}
    get:
      operationId: "getDocument"
      summary: "Read a Markdown document"
      security:
        - {"BearerAuth": []}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
            ETag:
              description: "Strong, quoted document version."
              schema: {"type": "string", "example": "\"1\""}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Document"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
        "504": {"$ref": "#/components/responses/RequestTimeout"}
    put:
      operationId: "replaceDocument"
      summary: "Replace a Markdown document"
      security:
        - {"BearerAuth": []}
      parameters:
        - {"$ref": "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/DocumentUpdate"}
      responses:
        "200":
          description: "Successful response"
          headers:
            X-Request-ID:
              description: "Request correlation ID."
              schema: {"type": "string"}
            ETag:
              description: "Strong, quoted document version."
              schema: {"type": "string", "example": "\"1\""}
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Document"}
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "413": {"$ref": "#/components/responses/PayloadTooLarge"}
        "500": {"$ref": "#/components/responses/InternalError"}
        "503": {"$ref": "#/components/responses/ServiceUnavailable"}
